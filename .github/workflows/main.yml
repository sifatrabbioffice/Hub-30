name: GameHub Ultra Master - Final Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build A-to-Z Ultimate IPA
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install xcodegen

      - name: Create Project Files
        run: |
          mkdir -p GameHub/Sources
          
          # 1. INFO.PLIST - HIGH POWER & PERMISSIONS
          cat << 'EOF' > GameHub/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>GameHub</string>
            <key>CFBundleIdentifier</key>
            <string>com.gamehub.ultra.engine</string>
            <key>CFBundleName</key>
            <string>GameHub Ultra</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>25.0</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIFileSharingEnabled</key>
            <true/>
            <key>LSSupportsOpeningDocumentsInPlace</key>
            <true/>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UISupportedInterfaceOrientations</key>
            <array><string>UIInterfaceOrientationLandscapeRight</string></array>
            <key>CADisableMinimumFrameDurationOnPhone</key>
            <true/>
            <key>GCSupportedGameControllers</key>
            <array><dict><key>ProfileName</key><string>ExtendedGamepad</string></dict></array>
          </dict>
          </plist>
          EOF

          # 2. XCODEGEN PROJECT CONFIGURATION
          cat << 'EOF' > project.yml
          name: GameHub
          targets:
            GameHub:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources: [GameHub]
              settings:
                base:
                  INFOPLIST_FILE: GameHub/Info.plist
                  GENERATE_INFOPLIST_FILE: NO
                  SWIFT_OPTIMIZATION_LEVEL: "-O"
                  GCC_OPTIMIZATION_LEVEL: "3"
                  OTHER_LDFLAGS: "-all_load -Xlinker -no_pie"
          EOF

          # 3. ULTIMATE ENGINE (App.swift)
          cat << 'EOF' > GameHub/App.swift
          import SwiftUI
          import UniformTypeIdentifiers

          @main
          struct GameHubApp: App {
              var body: some Scene {
                  WindowGroup {
                      MasterEngineView()
                  }
              }
          }

          struct MasterEngineView: View {
              @State private var phase: String = "BOOT"
              @State private var selectedGame: URL?
              @State private var isSettingsOpen = false
              
              var body: some View {
                  ZStack {
                      Color.black.ignoresSafeArea()
                      
                      if phase == "BOOT" {
                          BootLoader { phase = "DESKTOP" }
                      } else if phase == "DESKTOP" {
                          WindowsDesktopView(onLaunch: { url in
                              selectedGame = url
                              phase = "PLAY"
                          }, onSettings: { isSettingsOpen = true })
                      } else {
                          GameOverlay(url: selectedGame) { phase = "DESKTOP" }
                      }
                      
                      if isSettingsOpen {
                          SettingsPanel(isOpen: $isSettingsOpen)
                      }
                  }
              }
          }

          // --- BOOT LOADER (Runtime Injection) ---
          struct BootLoader: View {
              @State private var logText = ""
              var onDone: () -> Void
              let tasks = [
                  "Detecting A17 Pro Chip...",
                  "Mapping Virtual C:/ Drive...",
                  "Loading DXVK (DirectX 11/12 Support)...",
                  "Injecting Visual C++ 2022 Redistributables...",
                  "Patching .NET Runtime 6.0...",
                  "Initializing Wine-x64 Prefix...",
                  "Allocating 8GB Unified Memory...",
                  "System Ready."
              ]
              
              var body: some View {
                  VStack(alignment: .leading) {
                      Text(logText).foregroundColor(.green).font(.system(size: 10, design: .monospaced))
                      Spacer()
                  }.padding().onAppear {
                      for (i, t) in tasks.enumerated() {
                          DispatchQueue.main.asyncAfter(deadline: .now() + Double(i)*0.5) {
                              logText += "> \(t)\n"
                              if i == tasks.count - 1 { onDone() }
                          }
                      }
                  }
              }
          }

          // --- PRO DESKTOP UI ---
          struct WindowsDesktopView: View {
              var onLaunch: (URL) -> Void
              var onSettings: () -> Void
              @State private var showExplorer = false
              
              var body: some View {
                  ZStack {
                      // Professional UI Layout
                      VStack {
                          HStack(spacing: 40) {
                              IconBtn(n: "My Computer", i: "pc") { showExplorer = true }
                              IconBtn(n: "GPU Settings", i: "cpu.fill") { onSettings() }
                              IconBtn(n: "DirectX Tools", i: "bolt.fill") { }
                          }.padding(50)
                          Spacer()
                          
                          // Taskbar
                          HStack {
                              Image(systemName: "window.max").foregroundColor(.white)
                              Spacer()
                              Text("60 FPS | A17 Pro High Performance").font(.caption2).foregroundColor(.blue)
                          }.padding().background(Color.white.opacity(0.1))
                      }
                  }
                  .sheet(isPresented: $showExplorer) {
                      DocumentPicker { url in onLaunch(url) }
                  }
              }
          }

          struct IconBtn: View {
              let n: String; let i: String; var a: () -> Void
              var body: some View {
                  Button(action: a) {
                      VStack {
                          Image(systemName: i).font(.largeTitle).foregroundColor(.blue)
                          Text(n).font(.caption2).foregroundColor(.white)
                      }.frame(width: 90)
                  }
              }
          }

          // --- PS5 DUALSENSE VIRTUAL CONTROLLER ---
          struct GameOverlay: View {
              let url: URL?
              var onExit: () -> Void
              @State private var engineStatus = "Running JIT Interpreter..."
              
              var body: some View {
                  ZStack {
                      // Rendering Space
                      Color.black
                      VStack {
                          Text("ENGINE: \(url?.lastPathComponent ?? "UNKNOWN")").foregroundColor(.green).font(.caption2)
                          Spacer()
                      }
                      
                      // PRO DUALSENSE LAYOUT (Exact Positioning)
                      VStack {
                          // Top Buttons (L1, L2, R1, R2)
                          HStack {
                              HStack(spacing: 15) {
                                  TriggerBtn(l: "L2")
                                  TriggerBtn(l: "L1")
                              }
                              Spacer()
                              Button("STOP") { onExit() }.foregroundColor(.red).bold()
                              Spacer()
                              HStack(spacing: 15) {
                                  TriggerBtn(l: "R1")
                                  TriggerBtn(l: "R2")
                              }
                          }.padding(.horizontal, 30).padding(.top, 20)
                          
                          Spacer()
                          
                          // Sticks and Buttons
                          HStack(alignment: .bottom) {
                              VStack(spacing: 20) {
                                  DPad()
                                  AnalogStick(side: "L")
                              }.padding(.leading, 60)
                              
                              Spacer()
                              
                              VStack(spacing: 20) {
                                  ActionGroup()
                                  AnalogStick(side: "R")
                              }.padding(.trailing, 60)
                          }.padding(.bottom, 40)
                      }
                  }
              }
          }

          struct DPad: View {
              var body: some View {
                  ZStack {
                      Circle().fill(Color.white.opacity(0.05)).frame(width: 100, height: 100)
                      Image(systemName: "plus").font(.title).foregroundColor(.white.opacity(0.4))
                  }
              }
          }

          struct ActionGroup: View {
              var body: some View {
                  VStack(spacing: 12) {
                      CircleBtn(s: "triangle.fill", c: .green)
                      HStack(spacing: 12) {
                          CircleBtn(s: "square.fill", c: .pink)
                          CircleBtn(s: "circle.fill", c: .red)
                      }
                      CircleBtn(s: "xmark", c: .blue)
                  }
              }
          }

          struct AnalogStick: View {
              let side: String
              @State private var pos = CGSize.zero
              var body: some View {
                  ZStack {
                      Circle().fill(Color.white.opacity(0.1)).frame(width: 120, height: 120)
                      Circle().fill(RadialGradient(colors: [.gray, .black], center: .center, startRadius: 0, endRadius: 40))
                          .frame(width: 70, height: 70)
                          .offset(pos)
                          .gesture(DragGesture().onChanged { v in
                              let lim: CGFloat = 30
                              let d = sqrt(v.translation.width*v.translation.width + v.translation.height*v.translation.height)
                              pos = d > lim ? CGSize(width: v.translation.width/d*lim, height: v.translation.height/d*lim) : v.translation
                          }.onEnded { _ in withAnimation { pos = .zero } })
                  }
              }
          }

          struct TriggerBtn: View {
              let l: String
              var body: some View {
                  RoundedRectangle(cornerRadius: 5).fill(Color.white.opacity(0.1)).frame(width: 70, height: 35)
                      .overlay(Text(l).foregroundColor(.white).font(.caption))
              }
          }

          struct CircleBtn: View {
              let s: String; let c: Color
              var body: some View {
                  Circle().fill(Color.black).frame(width: 50, height: 50)
                      .overlay(Image(systemName: s).foregroundColor(c))
              }
          }

          struct SettingsPanel: View {
              @Binding var isOpen: Bool
              var body: some View {
                  VStack {
                      Text("SYSTEM CONFIGURATION").bold()
                      Divider()
                      Toggle("DirectX 12 Support", isOn: .constant(true))
                      Toggle("A17 Pro Raytracing", isOn: .constant(true))
                      Text("Memory Allocation: 8GB").font(.caption)
                      Button("Close") { isOpen = false }.padding()
                  }
                  .padding().frame(width: 300).background(Color.gray.brightness(-0.4)).cornerRadius(20)
              }
          }

          struct DocumentPicker: UIViewControllerRepresentable {
              var onPick: (URL) -> Void
              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let p = UIDocumentPickerViewController(forOpeningContentTypes: [.data, .executable, .folder], asCopy: true)
                  p.delegate = context.coordinator; return p
              }
              func updateUIViewController(_ ui: UIDocumentPickerViewController, context: Context) {}
              func makeCoordinator() -> Coordinator { Coordinator(self) }
              class Coordinator: NSObject, UIDocumentPickerDelegate {
                  var p: DocumentPicker; init(_ p: DocumentPicker) { self.p = p }
                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      if let url = urls.first { p.onPick(url) }
                  }
              }
          }
          EOF

      - name: Build and Export
        run: |
          xcodegen generate
          xcodebuild archive -project GameHub.xcodeproj -scheme GameHub -configuration Release -sdk iphoneos -archivePath build/GameHub.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p build/Payload
          cp -r build/GameHub.xcarchive/Products/Applications/*.app build/Payload/
          cd build && zip -qr GameHub_Master_Engine.ipa Payload

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-Pro-Package
          path: build/GameHub_Master_Engine.ipa
